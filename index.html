<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zapp 相机 · 法律文档</title>
<style>
  :root{--paper:#F6F2EA;--card:#FFFFFF;--ink:#222A30;--sub:#83898F;--blue:#1FB6E6;--bluedeep:#0E7FA8;--amber:#F4CC1F;--line:#ECE5D8}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:960px;margin:0 auto;padding:64px 20px 40px}
  .hero{text-align:center;margin-bottom:44px}
  .biglogo{width:92px;height:92px;border-radius:22px;background:linear-gradient(160deg,#F9DE54,#F2C414);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;color:var(--bluedeep);font-style:italic;font-weight:900;font-size:56px;box-shadow:0 10px 28px rgba(190,150,30,.28)}
  .hero h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .hero p{margin-top:10px;color:var(--sub);font-size:15px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px;text-decoration:none;color:var(--ink);box-shadow:0 6px 20px rgba(60,45,20,.05);transition:transform .15s ease,box-shadow .15s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(60,45,20,.1)}
  .card .ic{width:42px;height:42px;border-radius:11px;background:#E2F5FC;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .card h2{font-size:17px;font-weight:800}
  .card p{font-size:13.5px;color:var(--sub);margin-top:8px;line-height:1.7}
  .go{margin-top:14px;font-size:13.5px;font-weight:700;color:var(--bluedeep)}
  footer{margin-top:48px;color:var(--sub);font-size:13px;text-align:center;line-height:1.9}
  footer a{color:var(--bluedeep);text-decoration:none}
  @media (max-width:760px){.cards{grid-template-columns:1fr}.wrap{padding:44px 18px 32px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="biglogo">Z</div>
    <h1>Zapp 相机</h1>
    <p>胶片模拟与光学滤镜 · 法律文档中心</p>
  </div>
  <div class="cards">
    <a class="card" href="privacy.html">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3l8 3.5v5c0 5-3.4 8.2-8 9.5C7.4 19.7 4 16.5 4 11.5v-5L12 3z" stroke="#0E7FA8" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#0E7FA8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h2>隐私政策</h2>
      <p>说明我们如何对待你的信息、申请的权限，以及你享有的权利。</p>
      <div class="go">查看 →</div>
    </a>
    <a class="card" href="terms.html">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M7 3h7l4 4v14H7V3z" stroke="#0E7FA8" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3v4h4M9.5 12h5M9.5 15.5h5" stroke="#0E7FA8" stroke-width="1.7" stroke-linecap="round"/></svg></span>
      <h2>用户协议</h2>
      <p>服务内容、会员权益、用户内容与使用规范等约定。</p>
      <div class="go">查看 →</div>
    </a>
    <a class="card" href="subscription.html">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M20 7L9.5 17.5 4 12" stroke="#0E7FA8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9.2" stroke="#0E7FA8" stroke-width="1.4" opacity=".35"/></svg></span>
      <h2>会员条款</h2>
      <p>订阅周期、价格、自动续费与取消、退款规则。</p>
      <div class="go">查看 →</div>
    </a>
  </div>
  <footer>
    Zapp 相机 · 运营者 Peter Jr · 联系邮箱 <a href="mailto:313510307@qq.com">313510307@qq.com</a><br>
    © 2026 Peter Jr
  </footer>
</div>
</body>
</html>
